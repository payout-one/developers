<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/pure.css" />

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
    title="docsify-darklight-theme" type="text/css" />
</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "Payout Developers",
      repo: "payout-one/developers",
      loadNavbar: "_nav.md",
      loadSidebar: "_sidebar.md",
      loadFooter: "_footer.md",
      autoHeader: false,
      logo: "/_media/logo_dark.svg",
      themeColor: "#3a1768",
      mergeNavbar: true,
      "flexible-alerts": {
        style: "flat",
      },
    };
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
  <script src="https://unpkg.com/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/@alertbox/docsify-footer/dist/docsify-footer.min.js"></script>
  <script>
    // The service worker is stale-while-revalidate and races cache against
    // network, so during local development it keeps serving the previous
    // _sidebar.md / *.md for a reload or two after you edit them. Skip it on
    // localhost, and tear down any registration left over from an earlier run.
    (function () {
      if (typeof navigator.serviceWorker === "undefined") return;
      var local = ["localhost", "127.0.0.1", "[::1]", ""].indexOf(location.hostname) > -1;
      if (local) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        });
        if (window.caches && caches.keys) {
          caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
        }
        return;
      }
      navigator.serviceWorker.register("sw.js");
    })();
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/external-script.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cshtml.min.js"></script>
  <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
</body>

</html>
